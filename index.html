<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Belajar Yuk! - Game Edukasi Anak</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="sky">
  <div class="cloud c1">☁️</div>
  <div class="cloud c2">☁️</div>
  <div class="cloud c3">☁️</div>
</div>

<div id="home" class="screen active">
  <div class="mascot" id="mascot">🐣</div>
  <h1 class="title">Belajar Yuk!</h1>
  <div class="menu-grid">
    <button class="menu-btn" style="--c:#ff6b6b" data-target="balon">
      <span class="emoji">🎈</span><span>Balon Huruf</span>
    </button>
    <button class="menu-btn" style="--c:#ffb627" data-target="hewan">
      <span class="emoji">🐮</span><span>Suara Hewan</span>
    </button>
    <button class="menu-btn" style="--c:#1dd1a1" data-target="cari">
      <span class="emoji">🔍</span><span>Cari yang Mana?</span>
    </button>
    <button class="menu-btn" style="--c:#6c5ce7" data-target="planet">
      <span class="emoji">🪐</span><span>Tata Surya</span>
    </button>
  </div>
</div>

<div id="balon" class="screen game">
  <div class="topbar">
    <button class="back-btn">⬅</button>
    <div class="toggle">
      <button class="mode-btn active" data-mode="abc">ABC</button>
      <button class="mode-btn" data-mode="hijaiyah">ا ب ت</button>
      <button class="mode-btn" data-mode="tulis">✏️</button>
    </div>
  </div>
  <div class="balloon-field" id="balloon-field"></div>
  <div class="trace" id="trace">
    <canvas id="trace-canvas"></canvas>
    <div class="progress"><div class="progress-fill" id="trace-progress"></div></div>
    <div class="trace-nav">
      <button class="nav-btn" id="trace-prev">◀</button>
      <button class="nav-btn" id="trace-clear">🧽</button>
      <button class="nav-btn" id="trace-next">▶</button>
    </div>
  </div>
</div>

<div id="hewan" class="screen game">
  <div class="topbar"><button class="back-btn">⬅</button><span class="hint">Tap hewannya!</span></div>
  <div class="farm" id="farm"></div>
</div>

<div id="cari" class="screen game">
  <div class="topbar">
    <button class="back-btn">⬅</button>
    <div class="stars" id="stars">⭐ 0</div>
  </div>
  <button class="question" id="question">🔊 Mana kucing?</button>
  <div class="choices" id="choices"></div>
</div>

<div id="planet" class="screen game space">
  <div class="topbar"><button class="back-btn">⬅</button><span class="hint light">Tap planetnya!</span></div>
  <div class="solar" id="solar">
    <button class="sun" id="sun">☀️</button>
  </div>
  <div class="planet-label" id="planet-label"></div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
